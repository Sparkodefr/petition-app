name: CI / Déploiement Coolify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t petition-app:ci .

      - name: Smoke test
        run: |
          docker run -d --name petition -p 8080:3000 -e ADMIN_PASSWORD=ci-secret petition-app:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/health && break
            sleep 1
          done
          curl -fs http://localhost:8080/ | grep -q "Pétition"
          PNG="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
          curl -fs -H 'Content-Type: application/json' \
            -d "{\"id\":\"ci-test-0001\",\"nom\":\"Test\",\"prenom\":\"CI\",\"adresse\":\"1 rue du Test\",\"telephone\":\"0600000000\",\"signature\":\"$PNG\",\"createdAt\":\"2026-01-01T00:00:00Z\"}" \
            http://localhost:8080/api/signatures
          curl -fs http://localhost:8080/api/stats | grep -q '"count":1'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin/export)" = 401
          curl -fs -u admin:ci-secret http://localhost:8080/admin/export -o export.pdf
          head -c 5 export.pdf | grep -q '%PDF'
          echo "✓ Page, API et export PDF fonctionnels"

      - name: Logs en cas d'échec
        if: failure()
        run: docker logs petition || true

  deploy:
    name: Déclencher le déploiement Coolify
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Appel du webhook Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::Secrets COOLIFY_WEBHOOK / COOLIFY_TOKEN non définis : déploiement ignoré."
            exit 0
          fi
          curl -fsS --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
